{{- $name := include "bgs.name" . }}
{{- if hasKey .Values "gateway" }}{{ fail "gateway.* was renamed to publicService.* (chart 3.0.0)" }}{{ end }}
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  {{- if $.Values.gitops.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  {{- end }}
  name: {{ $name }}-rabbitmq
spec:
  replicas: {{ .Values.rabbitmq.replicas }}
  image: {{ .Values.rabbitmq.image }}
  persistence:
    storage: {{ .Values.rabbitmq.size }}
    {{- with .Values.rabbitmq.storageClass }}
    storageClassName: {{ . }}
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  {{- with .Values.publicService.labels }}
  labels: {{ toYaml . | nindent 4 }}
  {{- end }}
  annotations:
    {{- if $.Values.gitops.enabled }}
    # After the frontend/REST rollout (wave 10), so the published address has endpoints.
    argocd.argoproj.io/sync-wave: "20"
    {{- end }}
    external-dns.alpha.kubernetes.io/hostname: {{ required "publicService.hostname required" .Values.publicService.hostname | quote }}
    {{- with .Values.publicService.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: LoadBalancer
  {{- with .Values.publicService.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  # Every advertising node must forward both ports; see docs/adr/0001.
  externalTrafficPolicy: Cluster
  ipFamilyPolicy: PreferDualStack
  selector: {app.kubernetes.io/instance: {{ .Release.Name | quote }}, skymist.io/public: "true"}
  ports:
    - {name: frontend, port: 1119, targetPort: frontend, protocol: TCP}
    - {name: rest, port: 443, targetPort: https, protocol: TCP}
