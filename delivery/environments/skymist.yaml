# Existing claim templates are immutable; retained PVCs are protected during adoption.
certificate:
  enabled: true
database:
  create: false
  host: skymist-db-primary
  mariaDbRef: skymist-db
publicService:
  hostname: bnet.neomatik.eu
  loadBalancerClass: io.cilium/bgp-control-plane
  labels:
    scope: public
  annotations:
    service.cilium.io/forwarding-mode: dsr
    service.cilium.io/lb-algorithm: maglev
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
image:
  repository: registry.neomatik.eu/skymist/bgs
  tag: cata-15595-39cce1323341@sha256:0824af1b0cfe42c635a6d054fad0d630da3a9d505a6f1a55ac91d1c36065ac98
imagePullSecrets:
- name: registry-secret
rabbitmq:
  replicas: 3
  storageClass: ssd-block
redis-ha:
  extraVolumes:
  - configMap:
      name: skymist-realm-redis-acl
    name: realm-acl
  persistentVolume:
    annotations: null
    storageClass: ssd-block
  redis:
    customArgs:
    - /data/conf/redis.conf
    - --aclfile
    - /realm-acl/redis.acl
    extraVolumeMounts:
    - mountPath: /realm-acl
      name: realm-acl
      readOnly: true
  replicas: 3
  sentinel:
    customArgs:
    - /data/conf/sentinel.conf
    - --aclfile
    - /realm-acl/sentinel.acl
    extraVolumeMounts:
    - mountPath: /realm-acl
      name: realm-acl
      readOnly: true
replicas: 2
