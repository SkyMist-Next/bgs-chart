certificate:
  enabled: true
database:
  create: false
  host: skymist-db-primary
  mariaDbRef: skymist-db
gateway:
  className: public-dual-stack
  hostname: bnet.neomatik.eu
gitops:
  enabled: true
image:
  digest: sha256:ff8ae3c58f1b33e3e1978c4b4821f5d5567cfdd7d34383be940a1c91aa5bf7b7
  repository: registry.neomatik.eu/skymist/bgs
  tag: ''
imagePullSecrets:
- name: registry-secret
rabbitmq:
  replicas: 3
  storageClass: ssd-block
redis-ha:
  extraVolumes:
  - configMap:
      name: skymist-realm-redis-acl
    name: realm-acl
  persistentVolume:
    annotations: null
    storageClass: ssd-block
  redis:
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
      argocd.argoproj.io/sync-wave: '-5'
    customArgs:
    - /data/conf/redis.conf
    - --aclfile
    - /realm-acl/redis.acl
    extraVolumeMounts:
    - mountPath: /realm-acl
      name: realm-acl
      readOnly: true
  replicas: 3
  sentinel:
    customArgs:
    - /data/conf/sentinel.conf
    - --aclfile
    - /realm-acl/sentinel.acl
    extraVolumeMounts:
    - mountPath: /realm-acl
      name: realm-acl
      readOnly: true
replicas: 2
