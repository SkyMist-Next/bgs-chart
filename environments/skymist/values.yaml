certificate:
  enabled: true
database:
  create: false
  host: skymist-db-primary
  mariaDbRef: skymist-db
gitops:
  enabled: true
image:
  digest: sha256:0bb7de793ad6c8342376e2d91ca8add6676384597da829d4f05a24f19bc10f53
  repository: registry.neomatik.eu/skymist/bgs
  tag: ''
imagePullSecrets:
- name: registry-secret
publicService:
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'false'
    service.cilium.io/forwarding-mode: dsr
    service.cilium.io/lb-algorithm: maglev
  hostname: bnet.neomatik.eu
  labels:
    scope: public
  loadBalancerClass: io.cilium/bgp-control-plane
rabbitmq:
  replicas: 3
  storageClass: ssd-block
redis-ha:
  extraVolumes:
  - configMap:
      name: skymist-realm-redis-acl
    name: realm-acl
  persistentVolume:
    annotations: null
    storageClass: ssd-block
  redis:
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
      argocd.argoproj.io/sync-wave: '-5'
    customArgs:
    - /data/conf/redis.conf
    - --aclfile
    - /realm-acl/redis.acl
    extraVolumeMounts:
    - mountPath: /realm-acl
      name: realm-acl
      readOnly: true
  replicas: 3
  sentinel:
    customArgs:
    - /data/conf/sentinel.conf
    - --aclfile
    - /realm-acl/sentinel.acl
    extraVolumeMounts:
    - mountPath: /realm-acl
      name: realm-acl
      readOnly: true
replicas: 2
